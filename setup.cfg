[metadata]
name = dali-drivers
version = 1.0a3
description = Drivers for interfacing to DALI lighting systems
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Stephen Early
author_email = steve@assorted.org.uk
url = https://github.com/sde1000/dali-drivers
license = LGPL-3.0-or-later
license_files =
    COPYING
    COPYING.LESSER
    LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3

[options]
python_requires = >=3.10
packages =
    dalidrivers
    dalidrivers.misc
    dalidrivers.typed
    dalidrivers.tests
install_requires =
    python-dali>=1.0a2

[options.extras_require]
driver-unipi =
    pyusb
    pymodbus
    pyserial
driver-serial = serialx>=1.11.0
driver-philips =
    hidapi
driver-hid =
    hidapi
test =
    pytest
    pytest-asyncio
    pymodbus
    pyserial
    serialx>=1.11.0

[flake8]
exclude = dalidrivers/misc/
ignore = E741, W503
# Please write with max-line-length = 80 where possible
max-line-length = 103
